<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitas Técnicas</title>
  <link rel="stylesheet" type="text/css" href="/css/styleVisitasTecnicas.css">
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

</head>

<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <figure>
      <img class="logo" id="imgTopo" src="/img/Logo-Zeiss-Coop-Transparent.png" alt="Logo Zeiss">
      <img class="logo" id="imgSenai" src="/img/senai-azul.png" alt="Logo Senai Azul">
    </figure>
  </header>

  <main class="container">
    <h1>Controle de Visitas Técnicas</h1>

    <!-- Campo de pesquisa e filtros -->
    <div class="filtros-container">
      <input type="text" id="campoPesquisa" placeholder="Pesquisar por responsável, empresa, local ou observações...">

      <div class="filtros-datas">
        <label>Data Solicitada:</label>
        <input type="date" id="dataSolicitadaInicio">
        <input type="date" id="dataSolicitadaFim">

        <label>Data Agendada:</label>
        <input type="date" id="dataAgendadaInicio">
        <input type="date" id="dataAgendadaFim">
      </div>

      <div class="filtro-visita-realizada">
        <label>Visita Realizada:</label>
        <select id="filtroVisitaRealizada">
          <option value="">Todas</option>
          <option value="true">Sim</option>
          <option value="false">Não</option>
        </select>
      </div>
    </div>

    <!-- Botão Nova Visita -->
    <button id="btnNovaVisita" class="btn-nova-visita">+ Nova Visita</button>

    <!-- Tabela de visitas -->
    <div id="visitasContainer">
      <table id="tabelaVisitas" class="tabela-visitas tabela-estilo">
        <thead>
          <tr>
            <th>Responsável</th>
            <th>Empresa/Instituição</th>
            <th>Data Solicitada</th>
            <th>Data Agendada</th>
            <th>Realizada?</th>
            <th>Qtd. Visitantes</th>
            <th>Local</th>
            <th>Telefones</th>
            <th>Observação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <!-- Visitas serão carregadas aqui via JS -->
        </tbody>
      </table>
    </div>

    <!-- Paginação -->
    <div class="paginacao">
      <button id="btnAnterior" disabled>Anterior</button>
      <span id="paginaAtual">1</span>
      <button id="btnProximo" disabled>Próximo</button>
    </div>
  </main>

  <!-- Modal -->
  <div id="modalVisita" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Registro de Visita Técnica</h2>
      <form id="visitaForm">
        <input type="hidden" id="visitaId">

        <label for="responsavel">Responsável:</label>
        <input type="text" id="responsavel" placeholder="Nome do responsável" pattern="[A-Za-zÀ-ÿ\s]+"
          title="Somente letras são permitidas." required>

        <label for="empresa">Empresa/Instituição:</label>
        <input type="text" id="empresa" placeholder="Nome da empresa" required>

        <label for="dataSolicitada">Data Solicitada:</label>
        <input type="date" id="dataSolicitada" required>

        <label for="dataAgendada">Data Agendada:</label>
        <input type="date" id="dataAgendada">

        <label for="visitaRealizada">Visita Realizada?</label>
        <select id="visitaRealizada">
          <option value="true">Sim</option>
          <option value="false">Não</option>
        </select>

        <label for="quantidade">Quantidade de Visitantes:</label>
        <input type="number" id="quantidade" placeholder="Número de visitantes" min="1" max="99" required>

        <label for="local">Local da Visita:</label>
        <input type="text" id="local" placeholder="Local da visita" required>

        <label for="telefones">Telefones:</label>
        <input type="text" id="telefones" placeholder="(99) 99999-9999" pattern="^\(\d{2}\) \d{4,5}-\d{4}$"
          title="Formato esperado: (99) 99999-9999" required>

        <label for="observacao">Observação:</label>
        <textarea id="observacao" placeholder="Observações adicionais"></textarea>

        <button type="submit" class="btn-salvar">Salvar Visita</button>

        <button id="btnExcluirVisita" style="display:none; background-color:#dc3545; margin-top: 10px;">Excluir
          Visita</button>
      </form>
    </div>
  </div>

  <!-- Rodapé -->
  <footer class="rodape">
    <h3>R. Armogaste José da Silveira, 612 - St. Centro Oeste | Goiânia - GO, 74560-550</h3>
    <h3>CNPJ: 03.783.850/0018-40</h3>
    <figure>
      <img class="logo-pequena" src="/img/CentroMetrologia-logo.png" alt="Logo Centro de Metrologia SENAI Zeiss">
    </figure>
  </footer>

  <!-- JavaScript -->
  <script src="/js/visitasTecnicas.js"></script>
</body>

</html>
