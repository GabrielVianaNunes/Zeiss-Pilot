<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviços</title>
  <link rel="stylesheet" type="text/css" href="/css/styleServicos.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
      <figure>
          <img class="logo" id="imgTopo" src="/img/Logo-Zeiss-Coop-Transparent.png" alt="Logo Zeiss">
          <img class="logo" id="imgSenai" src="/img/senai-azul.png" alt="Logo Senai Azul">
      </figure>
  </header>  

  <!-- Conteúdo Principal -->
  <main class="container">
      <h2>Gerenciamento de Serviços</h2>

      <!-- Botão para Abrir o Modal -->
    <button id="btnNovoServico">+ Novo Serviço</button>
    <a href="/servicos/relatorio-servicos">
        <button class="btn-dashboard">Dashboards</button>
    </a>
  

      <!-- Tabela de Serviços -->
      <table>
          <thead>
              <tr>
                  <th>Cliente</th>
                  <th>Solicitação</th>
                  <th>Quantidade</th>
                  <th>Status</th>
                  <th>Valor</th>
                  <th>Observação</th>
                  <th>Ações</th>
              </tr>
          </thead>
          <tbody id="tabelaServicos">
              <!-- Linhas serão adicionadas dinamicamente pelo JavaScript -->
          </tbody>
      </table>
  </main>

  <!-- Modal de Cadastro de Serviço -->
  <div id="modalServico" class="modal">
      <div class="modal-content">
          <span class="close">&times;</span>
          <h2>Cadastrar Serviço</h2>
          <form id="servicoForm">
              <input type="hidden" id="servicoId">

              <label for="cliente">Cliente:</label>
              <input type="text" id="cliente" placeholder="Nome do cliente" required>

              <label for="solicitacao">Solicitação:</label>
              <input type="text" id="solicitacao" placeholder="Descrição do serviço" required>

              <label for="quantidade">Quantidade:</label>
              <input type="number" id="quantidade" placeholder="Quantidade" required>

              <label for="status">Status:</label>
              <select id="status" required>
                  <option value="1º Contato">1º Contato</option>
                  <option value="Elaboração de proposta">Elaboração de proposta</option>
                  <option value="Visita">Visita</option>
                  <option value="Negociação">Negociação</option>
                  <option value="Venda finalizada">Venda finalizada</option>
                  <option value="Desistiu">Desistiu</option>
              </select>

              <label for="valor">Valor (R$):</label>
              <input type="number" id="valor" step="0.01" placeholder="Valor do serviço" required>

              <label for="observacao">Observação (Opcional):</label>
              <textarea id="observacao" placeholder="Observações adicionais"></textarea>

              <button type="submit" class="btn-salvar">Salvar Serviço</button>
              <button type="button" id="btnExcluirServico" class="btn-excluir-modal" style="display: none;">Excluir Serviço</button>
          </form>
      </div>
  </div>

  <!-- Rodapé -->
  <footer class="rodape">
      <h3>R. Armogaste José da Silveira, 612 - St. Centro Oeste</h3>
      <h3>Goiânia - GO, 74560-550</h3>
      <h3>CNPJ: 03.783.850/0018-40</h3>
      <figure>
          <img class="logo-pequena" src="/img/SENAI_2024_completa_negativada.png" alt="Logo SENAI">
      </figure>
  </footer>

  <!-- JavaScript -->
  <script src="/js/servicos.js"></script>

</body>
</html>
