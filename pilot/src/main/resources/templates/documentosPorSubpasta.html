<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentos por Subpasta</title>
  <link rel="stylesheet" href="/css/styleDocumentos.css" />
</head>
<body>
  <!-- Cabeçalho -->
  <header class="cabecalho">
    <figure>
      <img class="logo" id="imgTopo" src="/img/Logo-Zeiss-Coop-Transparent.png" alt="Logo Zeiss" />
      <img class="logo" id="imgSenai" src="/img/senai-azul.png" alt="Logo Senai Azul" />
    </figure>
  </header>

  <!-- Conteúdo -->
  <main class="container">
    <h1>Documentos da Subpasta</h1>

    <!-- Pesquisa -->
    <div class="pesquisa-container">
      <input type="checkbox" class="pesquisa-checkbox" />
      <div class="pesquisa-box">
        <div class="pesquisa-icon-container">
          <svg viewBox="0 0 512 512" height="1em" xmlns="http://www.w3.org/2000/svg" class="pesquisa-icon" aria-hidden="true">
            <path d="M505 442.7l-99.7-99.7C429.8 305.9 448 259.8 448 208 448 93.1 354.9 0 240 0S32 93.1 32 208s93.1 208 208 208c51.8 0 99-18.2 135-48.7l99.7 99.7c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3zM240 368c-88.4 0-160-71.6-160-160S151.6 48 240 48s160 71.6 160 160-71.6 160-160 160z"></path>
          </svg>
        </div>
        <input type="text" class="pesquisa-input" id="filtroNome" placeholder="Pesquisar documento..." />
      </div>
    </div>

    <!-- Filtros -->
    <div class="filtros">
      <label for="filtroStatus">Status:</label>
      <select id="filtroStatus">
        <option value="">Todos</option>
        <option value="ativo">Ativo</option>
        <option value="prestes-a-vencer">Prestes a Vencer</option>
        <option value="expirado">Expirado</option>
      </select>

      <div class="limpar-container">
        <button type="button" onclick="limparFiltros()" class="btn-cadastrar limpar">Limpar Filtros</button>
      </div>
    </div>

    <!-- Tabela -->
    <section id="listaDocumentos">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Expiração</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaDocumentos">
          <!-- preenchido via JS -->
        </tbody>
      </table>
    </section>

    <!-- Paginação -->
    <div class="paginacao-container">
      <button id="btnAnterior" class="paginacao" type="button" onclick="paginaAnterior()" disabled>Anterior</button>
      <span id="paginaAtual">1</span>
      <button id="btnProximo" class="paginacao" type="button" onclick="proximaPagina()">Próxima</button>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="rodape">
    <h3>R. Armogaste José da Silveira, 612 - St. Centro Oeste | Goiânia - GO, 74560-550</h3>
    <h3>CNPJ: 03.783.850/0018-40</h3>
    <figure>
      <img class="logo-pequena" src="/img/CentroMetrologia-logo.png" alt="Logo Centro de Metrologia SENAI Zeiss" />
    </figure>
  </footer>

  <!-- CSRF (Spring Security) -->
  <script th:inline="javascript">
    /*<![CDATA[*/
    window.csrfToken  = /*[[${_csrf.token}]]*/ '';
    window.csrfHeader = /*[[${_csrf.headerName}]]*/ '';
    /*]]>*/
  </script>

  <script src="/js/documentosPorSubpasta.js"></script>
</body>
</html>
