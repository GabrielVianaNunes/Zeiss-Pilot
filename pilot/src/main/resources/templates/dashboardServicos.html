<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Serviços</title>
  <link rel="stylesheet" type="text/css" href="/css/styleDashboardServicos.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
      <figure>
          <img class="logo" id="imgTopo" src="/img/Logo-Zeiss-Coop-Transparent.png" alt="Logo Zeiss">
          <img class="logo" id="imgSenai" src="/img/senai-azul.png" alt="Logo Senai Azul">
      </figure>
  </header>  

  <!-- Conteúdo da Dashboard -->
  <main class="container">
    <h2>Dashboard de Serviços</h2>
    <br>
    <br>

    <!-- Indicadores -->
    <div class="indicadores">
      <div class="card-indicador">
        <h3>Total de Serviços</h3>
        <p id="totalServicos">0</p>
      </div>
      <div class="card-indicador">
        <h3>Valor Arrecadado</h3>
        <p id="valorArrecadado">R$ 0,00</p>
      </div>
    </div>

    <!-- Gráfico -->
    <div id="graficoContainer">
      <h4>Distribuição Mensal de Serviços</h4>
      <svg id="graficoServicos"></svg>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="rodape">
      <h3>R. Armogaste José da Silveira, 612 - St. Centro Oeste</h3>
      <h3>Goiânia - GO, 74560-550</h3>
      <h3>CNPJ: 03.783.850/0018-40</h3>
      <figure>
          <img class="logo-pequena" src="/img/SENAI_2024_completa_negativada.png" alt="Logo SENAI">
      </figure>
  </footer>

  <!-- JavaScript -->
  <script src="/js/dashboardServicos.js"></script>

</body>
</html>
