<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos</title>
  <link rel="stylesheet" type="text/css" href="/css/styleProjetos.css">
</head>
<body>

  <!-- Cabeçalho -->
<header class="cabecalho">
      <figure>
          <img class="logo" id="imgTopo" src="/img/Logo-Zeiss-Coop-Transparent.png" alt="Logo Zeiss">
          <img class="logo" id="imgSenai" src="/img/senai-azul.png" alt="Logo Senai Azul">
      </figure>
</header>

<div class="container-geral">
  
  <!-- Modal -->
  <div id="modalProjeto" class="modal">
    <div class="modal-content">
      <span class="fechar">&times;</span>
      <h2 id="tituloModal">Cadastrar Projeto</h2>
  
      <form id="formProjeto">
        <input type="hidden" id="projetoId">
  
        <label>Nome do Projeto:</label>
        <input type="text" id="nomeProjeto" required>
  
        <label>Objetivo:</label>
        <textarea id="objetivo"></textarea>
  
        <label>Atividades:</label>
        <textarea id="atividades"></textarea>
  
        <label>Responsável (ID):</label>
        <input type="number" id="responsavelId">
  
        <label>Prioridade:</label>
        <select id="prioridade">
          <option>Alta</option>
          <option>Média</option>
          <option>Baixa</option>
        </select>
  
        <label>Custo Anual Previsto:</label>
        <input type="text" id="custoAnualPrevisto">
  
        <label>Retorno Previsto:</label>
        <input type="text" id="retornoPrevisto">
  
        <label>Status:</label>
        <select id="status">
          <option>A iniciar</option>
          <option>Pendente autorização</option>
          <option>Em andamento</option>
          <option>Atrasada</option>
          <option>Concluído</option>
          <option>Descontinuado</option>
        </select>
  
        <label>Observação:</label>
        <textarea id="observacao"></textarea>
  
        <label>Previsão de Início:</label>
        <input type="date" id="previsaoInicio">
  
        <label>Previsão de Término:</label>
        <input type="date" id="previsaoTermino">
  
        <label>Data Real de Finalização:</label>
        <input type="date" id="dataRealFinalizacao">
  
        <button type="submit">Salvar</button>
      </form>
    </div>
  </div>
  
  <!-- Conteúdo da Página -->
  <main class="container">
    <div class="btn-container">
        <button id="btnAbrirModal" class="btn-cadastrar">+ Cadastrar Projeto</button>
      </div>      
    <h1>Lista de Projetos</h1>

    <table id="tabelaProjetos">
      <thead>
        <tr>
          <th>Projeto</th>
          <th>Responsável</th>
          <th>Prioridade</th>
          <th>Status</th>
          <th>Prev.Início</th>
          <th>Prev.Término</th>
          <th>Finalização Real</th>
        </tr>
      </thead>
      <tbody>
        <!-- Linhas serão preenchidas via JavaScript -->
      </tbody>
    </table>
  </main>
  </div>

  <!-- Rodapé -->
  <footer class="rodape">
      <h3>R. Armogaste José da Silveira, 612 - St. Centro Oeste</h3>
      <h3>Goiânia - GO, 74560-550</h3>
      <h3>CNPJ: 03.783.850/0018-40</h3>
      <figure>
          <img class="logo-pequena" src="/img/SENAI_2024_completa_negativada.png" alt="Logo SENAI">
      </figure>
  </footer>

  <!-- JavaScript -->
  <script src="/js/projetos.js"></script>
</body>
</html>
