<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Eventos</title>
  <link rel="stylesheet" type="text/css" href="/css/styleListaEventos.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
      <figure>
          <img class="logo" id="imgTopo" src="/img/Logo-Zeiss-Coop-Transparent.png" alt="Logo Zeiss">
          <img class="logo" id="imgSenai" src="/img/senai-azul.png" alt="Logo Senai Azul">
      </figure>
  </header>  

  <main class="container">
    <h1>Lista de Eventos</h1>
    <button id="btnNovoEvento">+ Novo Evento</button>
    <button id="btnDashboard">Dashboards</button>
    <div id="eventosContainer" class="eventos-grid">
        <!-- Os cards dos eventos serão inseridos dinamicamente aqui -->
    </div>
  </main>

  <!-- Modal para Criar/Editar Evento -->
  <div id="modalEvento" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Cadastro de Eventos</h2>
        <form id="eventoForm">
            <input type="hidden" id="eventoId">

            <label for="nomeEvento">Nome do Evento:</label>
            <input type="text" id="nomeEvento" placeholder="Digite o nome do evento" required>

            <label for="tipoEvento">Tipo do Evento:</label>
            <input type="text" id="tipoEvento" placeholder="Digite o tipo do evento" required>

            <label for="dataEvento">Data do Evento:</label>
            <input type="date" id="dataEvento" required>

            <label for="numConvidados">Número de Convidados:</label>
            <input type="number" id="numConvidados" placeholder="Digite o número de convidados" required>

            <label for="numPresentes">Número de Presentes:</label>
            <input type="number" id="numPresentes" placeholder="Digite o número de presentes" required>

            <label for="adesao">Adesão (%):</label>
            <input type="text" id="adesao" placeholder="Adesão calculada" disabled>

            <button type="submit" class="btn-salvar">Salvar Evento</button>
        </form>
    </div>
  </div>

  <!-- Rodapé -->
  <footer class="rodape">
      <h3>R. Armogaste José da Silveira, 612 - St. Centro Oeste</h3>
      <h3>Goiânia - GO, 74560-550</h3>
      <h3>CNPJ: 03.783.850/0018-40</h3>
      <figure>
          <img class="logo-pequena" src="/img/SENAI_2024_completa_negativada.png" alt="Logo SENAI">
      </figure>
  </footer>

  <!-- JavaScript -->
  <script src="/js/listaEventos.js"></script>

</body>
</html>
