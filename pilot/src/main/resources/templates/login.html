<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - ZEISS</title>
  <link rel="stylesheet" href="/css/styleLogin.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>Bem-vindo</h2>
      <p>Insira suas credenciais para acessar o sistema.</p>

      <form method="POST" action="/login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
        <!-- Mensagens de feedback -->
        <p th:if="${param.error}" style="color: red;">Email ou senha inválidos.</p>
        <p th:if="${param.logout}" style="color: green;">Logout realizado com sucesso.</p>
      
        <input type="email" name="username" placeholder="Email" required />
        <input type="password" name="password" placeholder="Senha" required />
        <button type="submit">Entrar</button>
      </form>
      

      <div class="login-footer">
        <img src="/img/Logo-Zeiss-Coop-Transparent.png" alt="Logo Zeiss" />
        <img src="/img/senai-azul.png" alt="Logo Senai" />
      </div>
    </div>
  </div>
</body>
</html>
