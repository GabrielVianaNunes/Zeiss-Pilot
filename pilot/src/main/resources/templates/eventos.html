<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventos</title>
  <!-- Flatpickr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styleEventos.css">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Eventos</h1>
    <form id="formEvento">
      <div class="form-group">
        <label for="nomeEvento">Nome do Evento:</label>
        <input type="text" id="nomeEvento" name="nomeEvento" placeholder="Digite o nome do evento" required>
      </div>
      <div class="form-group">
        <label for="tipoEvento">Tipo do Evento:</label>
        <input type="text" id="tipoEvento" name="tipoEvento" placeholder="Digite o tipo do evento" required>
      </div>
      <div class="form-group">
        <label for="dataEvento">Data do Evento:</label>
        <input type="text" id="dataEvento" name="dataEvento" placeholder="Selecione a data do evento" required>
      </div>
      <div class="form-group">
        <label for="numeroConvidados">Número de Convidados:</label>
        <input type="number" id="numeroConvidados" name="numeroConvidados" placeholder="Digite o número de convidados" min="0" required>
      </div>
      <div class="form-group">
        <label for="numeroPresentes">Número de Presentes:</label>
        <input type="number" id="numeroPresentes" name="numeroPresentes" placeholder="Digite o número de presentes" min="0" required>
      </div>
      <div class="form-group">
        <label for="adesao">Adesão (%):</label>
        <input type="text" id="adesao" name="adesao" placeholder="Adesão calculada" readonly>
      </div>
      <button type="submit">Salvar Evento</button>
    </form>
  </div>

  <!-- Flatpickr JS -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <!-- Arquivo JS externo -->
  <script src="scriptEventos.js"></script>
</body>
</html>
